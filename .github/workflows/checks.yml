name: checks
on:
  push:
  pull_request:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build check (generated files match source; parity + integrity)
        run: python3 scripts/build-pages.py --check
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Service worker tests
        run: node tests/sw.test.mjs
  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Locate Chrome
        run: echo "CHROME_BIN=$(command -v google-chrome || command -v chromium || command -v chromium-browser)" >> "$GITHUB_ENV"
      - name: "Runner self-test (verdicts: exit code, timeout, result block)"
        run: node tests/browser/selftest-runner.mjs
      - name: Browser tests (deterministic drives)
        run: node tests/browser/run.mjs
