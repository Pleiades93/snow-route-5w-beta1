<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Same Home Screen / viewport metadata as Snow Route (Beta 1.58) -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Strip Test B">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#eceff2">
<link rel="apple-touch-icon" href="https://pleiades93.github.io/snow-route-beta/icon-192.png">
<title>Strip Test B</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { background:#eceff2; }
  body { font-family:-apple-system, system-ui, sans-serif; }
  body.dvh { height:100%; height:100dvh; }
  /* full-screen layer: fixed to the layout viewport, like the app's map */
  #stage { position:fixed; inset:0; background:#cfe3f7; }
  /* 4px frame painted on the stage edges: a shortfall shows as page
     background BELOW the frame's bottom edge */
  #frame { position:absolute; inset:0; border:4px solid #d42a1e; pointer-events:none; }
  #frameB { position:absolute; left:0; right:0; bottom:0; height:10px; background:#2ecc71; }
  /* bottom bar cloned in spirit from the app's tab bar */
  #tabBar { position:fixed; left:0; right:0; bottom:0; height:64px;
    background:#ffffff; border-top:1px solid #c9ced6; display:flex; z-index:5; }
  body.sat #tabBar { padding-bottom: env(safe-area-inset-bottom); height: calc(64px + env(safe-area-inset-bottom)); }
  .tab { flex:1; display:flex; align-items:center; justify-content:center;
    font-size:13px; color:#333; }
  #readout { position:fixed; top:calc(70px + env(safe-area-inset-top)); left:10px; right:10px;
    background:rgba(255,255,255,.92); border:1px solid #999; border-radius:10px;
    padding:10px 12px; font:13px/1.5 ui-monospace, Menlo, monospace; color:#111; z-index:6; white-space:pre-line; }
  #inpWrap { position:fixed; left:10px; right:10px; bottom:84px; z-index:6; display:none; }
  body.input #inpWrap { display:block; }
  #inp { width:100%; font-size:16px; padding:10px; border:1px solid #999; border-radius:8px; }
  #variant { font-weight:700; }
</style>
</head>
<body class="input">
<div id="stage"><div id="frame"></div><div id="frameB"></div></div>
<div id="readout">measuring…</div>
<div id="inpWrap"><input id="inp" type="text" placeholder="Tap here to raise the keyboard, then dismiss it"></div>
<div id="tabBar"><div class="tab">One</div><div class="tab">Two</div><div class="tab">Home</div><div class="tab">Four</div><div class="tab">Five</div></div>
<script>
  document.documentElement.style.minHeight = screen.height + 'px';
  var q = new URLSearchParams(location.search);
  if (q.get('dvh')) document.body.classList.add('dvh');
  if (q.get('sat')) document.body.classList.add('sat');
  if (q.get('input')) document.body.classList.add('input');
  var parts = [];
  if (q.get('dvh')) parts.push('dvh');
  if (q.get('sat')) parts.push('sat');
  if (q.get('input')) parts.push('input');
  if (q.get('ctrl')) parts.push('ctrl');
  var variant = 'B';

  /* ?ctrl=1 loads the app's viewport-variable controller (variable 5) */
  if (q.get('ctrl')) {
    var fullH = 0;
    window.syncViewport = function () {
      try {
        var vv = window.visualViewport, de = document.documentElement;
        if (screen.height > screen.width && window.matchMedia('(display-mode: standalone)').matches)
          fullH = Math.max(fullH, screen.height);
        var kb = document.body.classList.contains('kb');
        if (!kb && fullH && vv && vv.height < fullH - 2) {
          de.style.setProperty('--vvh', fullH + 'px');
          de.style.setProperty('--vvb', Math.max(0, window.innerHeight - fullH) + 'px');
        } else if (vv) {
          de.style.setProperty('--vvh', vv.height + 'px');
          de.style.setProperty('--vvb', Math.max(0, window.innerHeight - vv.height - vv.offsetTop) + 'px');
        }
      } catch (e) {}
    };
    if (window.visualViewport) {
      visualViewport.addEventListener('resize', syncViewport);
      visualViewport.addEventListener('scroll', syncViewport);
    }
    window.addEventListener('resize', syncViewport);
    document.addEventListener('focusin', function (e) { if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) document.body.classList.add('kb'); });
    document.addEventListener('focusout', function () { setTimeout(function () { document.body.classList.remove('kb'); syncViewport(); }, 60); });
    syncViewport();
  }

  function tick() {
    var vv = window.visualViewport;
    var tab = document.getElementById('tabBar').getBoundingClientRect();
    var stg = document.getElementById('stage').getBoundingClientRect();
    var cs = getComputedStyle(document.documentElement);
    var txt = 'variant: ' + variant + '\n' +
      'ih ' + window.innerHeight + ' iw ' + window.innerWidth + '\n' +
      'vv h ' + (vv ? Math.round(vv.height) : '-') + ' top ' + (vv ? Math.round(vv.offsetTop) : '-') + '\n' +
      'scr ' + screen.width + 'x' + screen.height + '\n' +
      'docH ' + document.documentElement.clientHeight + ' bodyH ' + Math.round(document.body.getBoundingClientRect().height) + '\n' +
      'tabB ' + Math.round(tab.bottom) + ' stageB ' + Math.round(stg.bottom) + '\n' +
      'sat ' + probe.offsetHeight + ' sab ' + probeB.offsetHeight + '\n' +
      'sa ' + (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) + '\n' +
      'delta ' + (screen.height - window.innerHeight) + '  <- 59 = BAD STATE';
    document.getElementById('readout').textContent = txt;
  }
  /* probe the safe-area inset via a hidden consumer */
  var probe = document.createElement('div');
  probe.style.cssText = 'position:fixed;top:0;left:0;padding-top:env(safe-area-inset-top);visibility:hidden;';
  document.body.appendChild(probe);
  var probeB = document.createElement('div');
  probeB.style.cssText = 'position:fixed;bottom:0;left:0;padding-bottom:env(safe-area-inset-bottom);visibility:hidden;';
  document.body.appendChild(probeB);
  setInterval(function () {
    document.documentElement.style.setProperty('--sat-probe', probe.offsetHeight + 'px');
    tick();
  }, 500);
  tick();
</script>
</body>
</html>
